<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云回收管理后台</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/styles/choices.min.css"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="loginView" class="login-view">
      <section class="login-panel">
        <div class="brand">云回收管理后台</div>
        <div class="login-grid">
          <div>
            <h1>微信扫码登录</h1>
            <p class="muted">
              使用已加入管理员白名单的微信扫码，在小程序内确认后进入后台。
            </p>
            <div class="login-actions">
              <button id="refreshTicketBtn" class="primary-btn">刷新二维码</button>
            </div>
            <div id="loginMessage" class="message"></div>
          </div>
          <div class="qr-box">
            <img id="qrImage" alt="管理后台登录小程序码" />
            <div id="qrFallback" class="qr-fallback"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="appView" class="app-view hidden">
      <aside class="sidebar">
        <div class="logo">云回收</div>
        <button class="nav-btn active" data-view="orders">订单管理</button>
        <button class="nav-btn" data-view="categories">品类管理</button>
        <button class="nav-btn" data-view="settings">系统配置</button>
        <button id="logoutBtn" class="logout-btn">退出登录</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <h1 id="pageTitle">订单管理</h1>
            <p id="pageDesc">查看真实订单数据并推进订单状态</p>
          </div>
          <div id="adminName" class="admin-name"></div>
        </header>

        <section id="ordersView" class="content-view">
          <div class="toolbar">
            <select id="statusFilter" class="enhanced-select" aria-label="订单状态筛选">
              <option value="">全部状态</option>
              <option value="submitted">已提交</option>
              <option value="processing">处理中</option>
              <option value="completed">已完成</option>
              <option value="canceled">已取消</option>
            </select>
            <input id="keywordInput" placeholder="搜索订单号、摘要、备注、联系人或手机号" />
            <button id="searchOrdersBtn" class="secondary-btn">查询</button>
            <button id="reloadOrdersBtn" class="secondary-btn">刷新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>订单号</th>
                  <th>状态</th>
                  <th>摘要</th>
                  <th>联系人</th>
                  <th>预约时间</th>
                  <th>
                    <button class="sort-header active" type="button" data-sort-field="createTime">
                      创建时间
                      <span class="sort-arrows" aria-hidden="true"><i class="up"></i><i class="down active"></i></span>
                    </button>
                  </th>
                  <th>
                    <button class="sort-header" type="button" data-sort-field="updateTime">
                      修改时间
                      <span class="sort-arrows" aria-hidden="true"><i class="up"></i><i class="down"></i></span>
                    </button>
                  </th>
                  <th>金额</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="ordersBody"></tbody>
            </table>
          </div>
          <div class="pager">
            <button id="prevPageBtn" class="secondary-btn">上一页</button>
            <span id="pageInfo"></span>
            <button id="nextPageBtn" class="secondary-btn">下一页</button>
          </div>
        </section>

        <section id="categoriesView" class="content-view hidden">
          <div class="toolbar">
            <button id="newCategoryBtn" class="primary-btn">新增品类</button>
            <button id="reloadCategoriesBtn" class="secondary-btn">刷新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>图标</th>
                  <th>名称</th>
                  <th>单位</th>
                  <th>参考价</th>
                  <th>排序</th>
                  <th>状态</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="categoriesBody"></tbody>
            </table>
          </div>
        </section>

        <section id="settingsView" class="content-view hidden">
          <div class="toolbar">
            <button id="newSettingBtn" type="button" class="primary-btn">新增配置</button>
            <button id="reloadSettingsBtn" type="button" class="secondary-btn">刷新</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>名称</th><th>Key</th><th>类型</th><th>Value</th><th>说明</th><th>操作</th></tr></thead>
              <tbody id="settingsBody"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-mask"></div>
      <section class="modal-panel">
        <header class="modal-header">
          <h2 id="modalTitle"></h2>
          <button id="modalCloseBtn" class="icon-btn">×</button>
        </header>
        <div id="modalBody" class="modal-body"></div>
      </section>
    </div>

    <script src="./config.js"></script>
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/2.28.6/cloudbase.full.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js@11.1.0/public/assets/scripts/choices.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
